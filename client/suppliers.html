<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suppliers · GODAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/products.css" />
</head>
<body>

  <div class="topbar">
    <div class="brand-mark">GODAM</div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>
    <nav id="mainNav">
      <a href="products.html">Products</a>
      <a href="suppliers.html" class="active">Suppliers</a>
    </nav>
    <div class="user-info">
      <span class="username" id="navUsername"></span>
      <button class="logout-btn" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="page-wrap">
    <div class="page-header">
      <div>
        <div class="meta-label">Inventory</div>
        <h1>Suppliers</h1>
      </div>
      <a href="supplier-form.html" class="btn btn-primary">+ Add supplier</a>
    </div>

    <div class="table-wrap">
      <table id="suppliersTable" style="display:none;">
        <thead>
          <tr>
            <th>Name</th>
            <th>Contact email</th>
            <th>Phone</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="suppliersBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState">
        <div class="meta-label">No suppliers found</div>
        <p>Add your first supplier to start linking products to them.</p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/suppliers.js"></script>
</body>
</html>
